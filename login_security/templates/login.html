{% extends 'base.html' %}
{% block content %}
<div class="login_container">
    <div class="login_background">
        <h2>Login Form</h2>
        {% for message in messages %}
        <div class="message.tag">
            {{message}}
        </div>
        {% endfor %}
        <form method="POST">
            {% csrf_token %}
            {{forms.as_p}}
            <div class="login_button">
                <button type="submit">Login</button>
            </div>
        </form>
        <br><br>
        <a href="{% url 'register' %}">Create an account</a>
    </div>
</div>
{% endblock %}
